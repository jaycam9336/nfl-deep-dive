<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Hub — NFL Deep Dive</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0a1628;color:#fff}
header{background:#002244;padding:16px}h1{margin:4px 0;font-size:26px}a{color:#69be28}.back{font-size:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;position:sticky;top:0;background:#0a1628;z-index:4}
.tabs button{flex:1 1 140px;padding:16px;font-size:17px;font-weight:800;border-radius:12px;border:2px solid #69be28;background:#132c4d;color:#fff;min-height:56px}
.tabs button.on{background:#69be28;color:#002244}
main{padding:0 16px 30px}.card{background:#132c4d;border-radius:14px;padding:16px;margin:12px 0;line-height:1.55}
.card h3{margin-top:0;color:#69be28}table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:10px 8px;border-bottom:1px solid #2a4a73;text-align:left}th{color:#9fd8ff}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#c0392b;font-weight:800;font-size:12px}
input,select{padding:14px;font-size:16px;border-radius:10px;width:100%;margin:6px 0}
.src{font-size:13px;color:#cfe3ff;background:#0f243f;padding:12px;border-radius:10px}
.pos{font-weight:800;color:#69be28;margin-top:18px}
</style></head><body>
<header><a class="back" href="index.html">← All 32 teams</a><h1 id="title">Team</h1><div id="meta"></div></header>
<div id="shell"></div>
<div id="hub" style="display:none">
<nav class="tabs"><button data-t="depth" class="on">Depth + Injuries</button><button data-t="history">History</button><button data-t="draft">Draft History</button><button data-t="records">Franchise Records</button><button data-t="matchups">Vs Others</button><button data-t="playoffs">Playoffs</button><button data-t="statsdb">Stats Database</button><button data-t="college">College</button></nav>
<main>
<section id="depth"></section><section id="history" style="display:none"></section><section id="draft" style="display:none"></section><section id="records" style="display:none"></section><section id="matchups" style="display:none"></section><section id="playoffs" style="display:none"></section><section id="statsdb" style="display:none"></section><section id="college" style="display:none"></section>
</main></div>
<script>
const p=new URLSearchParams(location.search), abbr=(p.get('abbr')||'').toUpperCase(), name=p.get('name')||abbr;
title.textContent=name;
const tabs=['depth','history','draft','records','matchups','playoffs','statsdb','college'];
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');tabs.forEach(s=>document.getElementById(s).style.display=s==b.dataset.t?'block':'none')});
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
async function getj(u){let r=await fetch(u); if(!r.ok) throw new Error(u+' '+r.status); return r.json()}
(async()=>{
 let status;
 try{ status=await getj('data/status.json'); }catch(e){ status={complete:['SEA']} }
 // legacy SEA files map to generic folder after migration; if generic missing but abbr SEA, fall through to generic (generated)
 if(!status.complete || !status.complete.includes(abbr)){
   shell.innerHTML=`<main><div class="card"><h3>Data expanding soon</h3><p>This hub for ${esc(name)} is a shell. Complete hubs are marked ★ on the home screen.</p><p>We don't fabricate depth, draft, or records data, so this page stays empty until verified data is loaded.</p></div></main>`; return;
 }
 hub.style.display='block';
 try{ await load(); }catch(e){ shell.innerHTML=`<main><div class="card"><h3>Data load error</h3><p>${esc(e.message)}</p></div></main>`; }
})();
async function load(){
 const base=`data/${abbr}/`;
 const [core,draft,records,hist,exp,prec,cc]=await Promise.all(['core.json','draft.json','records.json','history.json','expanded.json','playoff_records.json','crosscheck.json'].map(u=>getj(base+u)));
 let college=null; try{ college=await getj(base+'college.json'); }catch(e){}
 let leaders=null; try{ leaders=await getj(base+'leaders.json'); }catch(e){}
 meta.innerHTML=`<span style="color:#69be28;font-weight:800">★ Complete hub — ${esc(name)}</span>`;
 const ccDraft=cc.draft_first_round||{}, ccWL=cc.games_seasons_wl||{};
 const src=`<div class="src">Source: ${esc(core.meta.source)}<br>Last updated: ${esc(core.meta.fetched_at_ct)} (America/Chicago) • Season: ${esc(core.meta.season)}<br>VERIFICATION: Depth ORDER is single-source (ESPN) — pending cross-check. Injury status/diagnosis is SINGLE-SOURCE / UNVERIFIED — ESPN only, pending cross-check. “Out” in ESPN feed can include coach's-decision inactives; injury type is shown where ESPN provided it. Roster cross-check for this team: ${esc((cc.depth_roster||{}).method||'see crosscheck.json')}</div>`;
 let h=src+`<div class="card"><h3>Next-game availability — non-Active players (${core.injuries.filter(i=>i.status!=='Active').length})</h3>`;
 core.injuries.filter(i=>i.status!=='Active').forEach(i=>{h+=`<p><span class="badge">${esc(i.status)}</span> <b>${esc(i.name)}</b> ${esc(i.pos||'')} ${i.details?`— ${esc(i.details.type||'')} ${i.details.side&&i.details.side!='Not Specified'?esc(i.details.side):''} • Return: ${esc(i.details.returnDate||'TBD')}`:''}<br><small>${esc(i.shortComment||'')}</small></p>`});
 h+=`</div>`;
 core.depth.forEach(chart=>{h+=`<div class="card"><h3>${esc(chart.name)}</h3>`;chart.positions.forEach(pos=>{h+=`<div class="pos">${esc(pos.pos)}</div>`;pos.athletes.forEach((a,idx)=>{let inj=a.injuries&&a.injuries.length?`<span class="badge">${esc(a.injuries[0].status)}</span>`:'';h+=`<p>${idx+1}. <b>${esc(a.name)}</b> ${a.jersey?'#'+esc(a.jersey):''} ${inj}</p>`})});h+=`</div>`});
 document.getElementById('depth').innerHTML=h;
 // history
 let seas=(hist.seasons||[]).map(c=>`<tr>${c.slice(0,12).map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('');
 let infoHtml=Object.entries(hist.info||{}).map(([k,v])=>`<b>${esc(k)}:</b> ${esc(v)}`).join(' • ');
 document.getElementById('history').innerHTML=`<div class="src">Sources: ${esc(hist.source)}<br>Last checked: ${esc(core.meta.fetched_at_ct)} CT<br>Accuracy note: season table as parsed returned ${(hist.seasons||[]).length} rows; missing years in parse: ${(hist.missing_years||[]).join(', ')||'none detected'} — missing/blank fields are PENDING verification, not filled in.</div>
 <div class="card"><h3>Overview</h3><p>${infoHtml||'Infobox not parsed — see Wikipedia source.'}</p>${(hist.intro||[]).map(x=>`<p>${esc(x)}</p>`).join('')}<p><b>Wikipedia history sections:</b> ${esc((hist.headings||[]).join(' • '))}</p></div>
 <div class="card"><h3>Season-by-season (Wikipedia table as fetched)</h3><div style="overflow-x:auto"><table>${seas}</table></div></div>`;
 // draft
 let dmin=draft.length?Math.min(...draft.map(x=>x.year)):null, dmax=draft.length?Math.max(...draft.map(x=>x.year)):null;
 document.getElementById('draft').innerHTML=`<div class="src">Source: nflverse draft_picks dataset (github.com/nflverse/nflverse-data, sourced from Pro-Football-Reference)<br>VERIFICATION: ${esc(ccDraft.status||'')} — matched on player+pick: ${ccDraft.matched_on_player_and_pick??'n/a'} of ${ccDraft.draft_first_count??'n/a'} first-rounders in this file; true disagreements listed in data/${abbr}/crosscheck.json (${(ccDraft.true_disagreements||[]).length}). Unmatched first-rounders + all rounds 2–7 are SINGLE-SOURCE (nflverse/PFR) pending cross-check.<br>Coverage: <b>${dmin}–${dmax} in this file — ${draft.length} picks</b>. Drafts before ${dmin} are NOT in this dataset, not claimed. Franchise code/year-range mapping used for relocated teams is in scripts/build_all.py.<br>Last updated: ${esc(core.meta.fetched_at_ct)} CT</div>
 <div class="card"><label>Search player/college<input id="dq" placeholder="Search…"></label><label>Year<select id="dy"><option value="">All years</option></select></label><label>Round<select id="dr"><option value="">All rounds</option></select></label><label>Position<select id="dp"><option value="">All positions</option></select></label><div id="dcount"></div><table><thead><tr><th>Year</th><th>Rd</th><th>Pick</th><th>Player</th><th>Pos</th><th>College</th></tr></thead><tbody id="db"></tbody></table></div>`;
 let years=[...new Set(draft.map(x=>x.year))].sort((a,b)=>b-a), rounds=[...new Set(draft.map(x=>x.round))].sort((a,b)=>a-b), poss=[...new Set(draft.map(x=>x.pos).filter(Boolean))].sort();
 dy.innerHTML+=years.map(y=>`<option>${y}</option>`).join(''); dr.innerHTML+=rounds.map(r=>`<option>${r}</option>`).join(''); dp.innerHTML+=poss.map(x=>`<option>${esc(x)}</option>`).join('');
 function rd(){let q=dq.value.toLowerCase(), f=draft.filter(x=>(!dy.value||x.year==dy.value)&&(!dr.value||x.round==dr.value)&&(!dp.value||x.pos==dp.value)&&(!q||x.player.toLowerCase().includes(q)||(x.college||'').toLowerCase().includes(q)));dcount.innerHTML=`<b>${f.length} picks</b>`;db.innerHTML=f.map(x=>`<tr><td>${x.year}</td><td>${x.round}</td><td>${x.pick}</td><td><b>${esc(x.player)}</b></td><td>${esc(x.pos)}</td><td>${esc(x.college)}</td></tr>`).join('')}
 [dq,dy,dr,dp].forEach(e=>e.oninput=rd); rd();
 // records
 let cats=[...new Set(records.records.map(r=>r.section))];
 let consec=records.records.filter(r=>/consecutive/i.test(r.text));
 let rh=`<div class="src">VERIFICATION: Records list is SINGLE-SOURCE (Wikipedia, citing PFR) pending full cross-check — PFR direct fetch was blocked (403) previously. Source: ${esc(records.source)}<br>Page found: ${esc(records.page||'none')}. Records parsed: ${records.records.length}. If 0, records are PENDING (no list page found/parsed), not fabricated.<br>Last updated: ${esc(core.meta.fetched_at_ct)} CT • Streak add-on computed below from nflverse games.</div>
 <div class="card"><h3>Streaks</h3><p><b>Longest regular-season win streak (computed):</b> ${exp.win_streak.games} games — ${esc(exp.win_streak.start)} to ${esc(exp.win_streak.end)}.<br><small>${esc(exp.win_streak.scope)}</small></p>${consec.map(r=>`<p>• [${esc(r.section)}] ${esc(r.text)}</p>`).join('')}<p><small>Consecutive-games-with-TD / sack / INT player streaks: not verified in fetched sources — labeled unavailable rather than invented.</small></p></div>`;
 if(leaders){
   rh+=`<div class="card"><h3>Computed leaders — regular season 1999–2025 (single-source computed, NOT all-time)</h3><p><small>${esc(leaders.source)}</small></p><label>Category<select id="lc"><option value="">Choose category…</option>${Object.keys(leaders.season_leaders).map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><div id="lleaders"></div></div>`;
 }
 cats.forEach(c=>{rh+=`<div class="card"><h3>${esc(c)}</h3>`+records.records.filter(r=>r.section==c).map(r=>`<p>• ${esc(r.text)}</p>`).join('')+`</div>`});
 document.getElementById('records').innerHTML=rh;
 if(leaders && document.getElementById('lc')){
   const show=()=>{let c=document.getElementById('lc').value; if(!c){document.getElementById('lleaders').innerHTML='';return}
     let sl=leaders.season_leaders[c]||[], cl=leaders.career_leaders_1999_2025[c]||[];
     document.getElementById('lleaders').innerHTML=`<h4>Top single seasons</h4>`+sl.map((x,i)=>`<p>${i+1}. <b>${esc(x.player)}</b> (${esc(x.pos)}) — ${x.value} in ${x.year}</p>`).join('')+`<h4>Career with team, 1999–2025 only</h4>`+cl.map((x,i)=>`<p>${i+1}. <b>${esc(x.player)}</b> (${esc(x.pos)}) — ${x.value}</p>`).join('');};
   document.getElementById('lc').oninput=show;
 }
 // matchups
 let mh=`<div class="src">VERIFICATION: Computed SINGLE-SOURCE (nflverse games) — season W-L cross-check vs Wikipedia: compared ${ccWL.seasons_compared??0}, matched ${ccWL.matches??0} (see crosscheck.json for mismatches/format notes). Source: ${esc(exp.source)}<br>Last updated: ${esc(core.meta.fetched_at_ct)} CT<br>Opponent codes are as in nflverse file (includes historical/relocated codes).</div><div class="card"><h3>Head-to-head — ${esc(name)} vs each opponent (1999–2026 file)</h3><input id="mq" placeholder="Filter opponent code…"><table><thead><tr><th>Opp</th><th>All W-L-T</th><th>Regular</th><th>Playoffs</th><th>Home</th><th>Away</th><th>PF-PA</th><th>Last</th></tr></thead><tbody id="mb"></tbody></table></div>`;
 document.getElementById('matchups').innerHTML=mh;
 const fmt=x=>`${x.w}-${x.l}${x.t?'-'+x.t:''}`;
 function rm(){let q=document.getElementById('mq').value.toUpperCase();document.getElementById('mb').innerHTML=exp.h2h.filter(x=>x.opp.includes(q)).map(x=>`<tr><td><b>${x.opp}</b></td><td>${fmt(x.all)}</td><td>${fmt(x.reg)}</td><td>${fmt(x.post)}</td><td>${fmt(x.home)}</td><td>${fmt(x.away)}</td><td>${x.all.pf}-${x.all.pa}</td><td>${x.last}</td></tr>`).join('')}
 document.getElementById('mq').oninput=rm; rm();
 // playoffs
 let ph=`<div class="src">Sources: Playoff games computed from nflverse games file (1999–2026 coverage); playoff franchise records from ${esc(prec.source)}<br>Last updated: ${esc(core.meta.fetched_at_ct)} CT<br>Playoff game list starts 1999 because games file does — earlier playoff history is in History/season table, not computed here.</div>`;
 ph+=`<div class="card"><h3>Playoff games (1999 season onward, ${exp.playoff_games.length})</h3><table><tr><th>Date</th><th>Season</th><th>Opp</th><th>H/A</th><th>Result</th><th>Score</th></tr>${exp.playoff_games.map(g=>`<tr><td>${g.date}</td><td>${g.season}</td><td>${g.opp}</td><td>${g.home?'Home':'Away'}</td><td><b>${g.result}</b></td><td>${g.pf}-${g.pa}</td></tr>`).join('')}</table></div>`;
 ph+=`<div class="card"><h3>Playoff franchise records (${prec.playoff_records.length})</h3>`+prec.playoff_records.map(r=>`<p>• [${esc(r.section)}] ${esc(r.text)}</p>`).join('')+`</div>`;
 document.getElementById('playoffs').innerHTML=ph;
 // statsdb
 let sb=`<div class="src">Massive sortable/filterable database — sources: team records + computed season stats (nflverse games, 1999–2026) + draft tab. Last updated: ${esc(core.meta.fetched_at_ct)} CT. Pending (labeled, not fabricated): player game logs, pre-1999 game-level stats, consecutive TD/sack/INT streaks.</div>
 <div class="card"><h3>Season-by-season team stats (computed, 1999–2026)</h3><table><thead><tr><th>Year</th><th>Reg</th><th>PF</th><th>PA</th><th>Playoffs</th><th>PF-P</th><th>PA-P</th><th>Home</th><th>Away</th></tr></thead><tbody>${exp.seasons.map(x=>`<tr><td>${x.year}</td><td>${x.reg}</td><td>${x.pf_reg}</td><td>${x.pa_reg}</td><td>${x.post}</td><td>${x.pf_post}</td><td>${x.pa_post}</td><td>${x.home}</td><td>${x.away}</td></tr>`).join('')}</tbody></table></div>
 <div class="card"><h3>All records database (${records.records.length}) — filter by category / text</h3><label>Category<select id="sc"><option value="">All categories</option>${[...new Set(records.records.map(r=>r.section))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><input id="sq" placeholder="Search records…"><div id="scount"></div><div id="slist"></div></div>`;
 document.getElementById('statsdb').innerHTML=sb;
 function rs(){let c=document.getElementById('sc').value,q=document.getElementById('sq').value.toLowerCase();let f=records.records.filter(r=>(!c||r.section==c)&&(!q||r.text.toLowerCase().includes(q)));document.getElementById('scount').innerHTML=`<b>${f.length} records</b>`;document.getElementById('slist').innerHTML=f.map(r=>`<p>• [${esc(r.section)}] ${esc(r.text)}</p>`).join('')}
 document.getElementById('sc').oninput=rs; document.getElementById('sq').oninput=rs; rs();
 // college
 if(!college){ document.getElementById('college').innerHTML=`<div class="src">College profiles: PENDING for this team in this run — run scripts/build_college_all.py. Not fabricated.</div>`; }
 else{
  let ch=`<div class="src">Player profiles — ${esc(name)} depth-chart players (${college.coverage.depth_players}).<br>College + draft: ESPN Core API vs nflverse (PFR): ${college.coverage.draft_espn_nflverse_exact_match} exact draft matches (✓ 2-source). Others single-source.<br>College season stats: ${esc(college.source_college_stats)}<br>Coverage: ${college.coverage.with_college_name}/${college.coverage.depth_players} college names, ${college.coverage.with_college_season_stats}/${college.coverage.depth_players} with college season stat lines. Blank = no ESPN stat line returned, not zero.<br>Last updated: ${esc(core.meta.fetched_at_ct)} CT</div><div class="card"><input id="cq" placeholder="Search player / college…"><div id="clist"></div></div>`;
  document.getElementById('college').innerHTML=ch;
  function rc(){let q=document.getElementById('cq').value.toLowerCase();document.getElementById('clist').innerHTML=college.players.filter(x=>x.name.toLowerCase().includes(q)||(x.college_espn||'').toLowerCase().includes(q)).map(x=>{
   let verified=(x.draft_espn&&x.draft_nflverse&&x.draft_espn.year==x.draft_nflverse.year&&x.draft_espn.round==x.draft_nflverse.round&&x.draft_espn.pick==x.draft_nflverse.pick)?'✓ 2-source draft':'single-source draft';
   let seasons=x.college_seasons&&x.college_seasons.length?x.college_seasons.map(s=>`<p><b>${s.year}:</b> ${Object.entries(s.stats).slice(0,14).map(([k,v])=>`${esc(k)}: ${esc(v)}`).join(' • ')}</p>`).join(''):'<p><small>No college season stat line returned by ESPN (single-source check pending).</small></p>';
   return `<div style="border-bottom:1px solid #2a4a73;padding:12px 0"><b style="font-size:18px">${esc(x.name)}</b> ${esc(x.depth_pos)} — ${esc(x.college_espn||'College unknown')}<br>Draft: ${x.draft_espn?`${x.draft_espn.year} Rd ${x.draft_espn.round} Pick ${x.draft_espn.pick}`:'Undrafted / not in ESPN draft field'} ${x.draft_nflverse?`(nflverse: ${x.draft_nflverse.year} Rd ${x.draft_nflverse.round} Pick ${x.draft_nflverse.pick}, ${esc(x.draft_nflverse.team)}, ${esc(x.draft_nflverse.college)})`:''} <span class="badge" style="background:#276749">${verified}</span>${seasons}</div>`}).join('')}
  document.getElementById('cq').oninput=rc; rc();
 }
}
</script></body></html>
