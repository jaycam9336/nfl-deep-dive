<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Hub — NFL Deep Dive</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0a1628;color:#fff}
header{background:#002244;padding:16px}h1{margin:4px 0;font-size:26px}a{color:#69be28}.back{font-size:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;position:sticky;top:0;background:#0a1628;z-index:4}
.tabs button{flex:1 1 140px;padding:16px;font-size:17px;font-weight:800;border-radius:12px;border:2px solid #69be28;background:#132c4d;color:#fff;min-height:56px}
.tabs button.on{background:#69be28;color:#002244}
main{padding:0 16px 30px}.card{background:#132c4d;border-radius:14px;padding:16px;margin:12px 0;line-height:1.55}
.card h3{margin-top:0;color:#69be28}table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:10px 8px;border-bottom:1px solid #2a4a73;text-align:left}th{color:#9fd8ff}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#c0392b;font-weight:800;font-size:12px}.q{background:#e67e22}.act{background:#277da1}
input,select{padding:14px;font-size:16px;border-radius:10px;width:100%;margin:6px 0}
.src{font-size:13px;color:#cfe3ff;background:#0f243f;padding:12px;border-radius:10px}
.pos{font-weight:800;color:#69be28;margin-top:18px}
</style></head><body>
<header><a class="back" href="index.html">← All 32 teams</a><h1 id="title">Team</h1><div id="meta"></div></header>
<div id="shell"></div>
<div id="hub" style="display:none">
<nav class="tabs"><button data-t="depth" class="on">Depth + Injuries</button><button data-t="history">History</button><button data-t="draft">Draft History</button><button data-t="records">Franchise Records</button><button data-t="matchups">Vs Others</button><button data-t="playoffs">Playoffs</button><button data-t="statsdb">Stats Database</button><button data-t="college">College</button></nav>
<main>
<section id="depth"></section><section id="history" style="display:none"></section><section id="draft" style="display:none"></section><section id="records" style="display:none"></section><section id="matchups" style="display:none"></section><section id="playoffs" style="display:none"></section><section id="statsdb" style="display:none"></section><section id="college" style="display:none"></section>
</main></div>
<script>
const p=new URLSearchParams(location.search), abbr=p.get('abbr'), name=p.get('name')||abbr;
title.textContent=name;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');['depth','history','draft','records','matchups','playoffs','statsdb','college'].forEach(s=>document.getElementById(s).style.display=s==b.dataset.t?'block':'none')});
if(abbr!=='SEA'){shell.innerHTML=`<main><div class="card"><h3>Data expanding soon</h3><p>This hub for the ${name} is a shell in v1. The complete example hub — depth chart + injuries, history, draft history, and franchise records — is built for the <a href="team.html?abbr=SEA&id=26&name=Seattle%20Seahawks">Seattle Seahawks</a>.</p><p>We don't fabricate depth, draft, or records data, so this page stays empty until verified data is loaded team-by-team.</p></div></main>`}
else{hub.style.display='block';load()}
async function load(){
 const [sea,draft,records,seasons,streaks,exp,prec,college]=await Promise.all(['data/seahawks.json','data/seahawks_draft.json','data/seahawks_records.json','data/seahawks_seasons_wiki.json','data/seahawks_streaks.json','data/seahawks_expanded.json','data/seahawks_playoff_records.json','data/seahawks_college.json'].map(u=>fetch(u).then(r=>r.json())));
 meta.innerHTML=`<span style="color:#69be28;font-weight:800">★ Complete hub — Seattle Seahawks</span>`;
 const src=`<div class="src">Source: ${sea.meta.source}<br>Last updated: ${sea.meta.fetched_at_ct} (America/Chicago) • Season: ${sea.meta.season}<br>VERIFICATION: Roster existence cross-checked ESPN + official seahawks.com roster (69/69 depth names found). Depth ORDER is single-source (ESPN) — pending cross-check. Injury status/diagnosis is SINGLE-SOURCE / UNVERIFIED — ESPN only, pending cross-check (NFL.com injury page did not load). Availability note: ESPN status as of fetch time — check return dates. “Out” in ESPN feed can include coach's-decision inactives; injury type is shown where ESPN provided it.</div>`;
 // depth
 let h=src+`<div class="card"><h3>Next-game availability — non-Active players</h3>`;
 sea.injuries.filter(i=>i.status!=='Active').forEach(i=>{h+=`<p><span class="badge">${i.status}</span> <b>${i.name}</b> ${i.pos||''} ${i.details?`— ${i.details.type||''} ${i.details.side&&i.details.side!='Not Specified'?i.details.side:''} • Return: ${i.details.returnDate||'TBD'}`:''}<br><small>${i.shortComment||''}</small></p>`});
 h+=`</div>`;
 sea.depth.forEach(chart=>{h+=`<div class="card"><h3>${chart.name}</h3>`;chart.positions.forEach(pos=>{h+=`<div class="pos">${pos.pos}</div>`;pos.athletes.forEach((a,idx)=>{let inj=a.injuries&&a.injuries.length?`<span class="badge">${a.injuries[0].status}</span>`:'';h+=`<p>${idx+1}. <b>${a.name}</b> ${a.jersey?'#'+a.jersey:''} ${inj}</p>`})});h+=`</div>`});
 depth.innerHTML=h;
 // history
 let seas=seasons.map(c=>`<tr><td>${c[0]}</td><td>${c[5]||''}</td><td>${c[6]}-${c[7]}${c[8]&&c[8]!='0'?'-'+c[8]:''}</td><td>${c[10]||''}</td></tr>`).join('');
 history.innerHTML=`<div class="src">Sources: Wikipedia — Seattle Seahawks / List of Seattle Seahawks seasons (infobox + season table, fetched for v1); ESPN team info. Last checked: ${sea.meta.fetched_at_ct} CT</div>
 <div class="card"><h3>Overview</h3><p><b>Founded:</b> June 4, 1974 • <b>Stadium:</b> Lumen Field, Seattle, Washington • <b>Headquarters:</b> Virginia Mason Athletic Center, Renton, Washington • <b>Colors:</b> College navy, action green, wolf grey • <b>Head coach:</b> Mike Macdonald • <b>General manager:</b> John Schneider (per Wikipedia infobox at fetch time)</p>
 <p>The Seahawks entered the NFL as an expansion team in 1976. Eras on Wikipedia's team history: Nordstrom/Sarkowsky era (1976–1988), Behring/Hofmann era (1988–1996), Paul Allen era (1997–2018), Mike Holmgren era (1999–2008), Jim L. Mora era (2009), Pete Carroll era (2010–2023), and Mike Macdonald era (2024–present).</p>
 <p><b>Highlight from the verified season table:</b> 2025 — 14–3, Won Divisional playoffs (49ers) 41–6, Won NFC Championship (Rams) 31–27, Won Super Bowl LX vs. Patriots 29–13 (as listed on Wikipedia at fetch time).</p></div>
 <div class="card"><h3>Season-by-season (Wikipedia table as fetched)</h3><table><tr><th>Year</th><th>Finish</th><th>W-L-T</th><th>Playoffs / Notes</th></tr>${seas}</table><p><small>Accuracy note: the fetched Wikipedia table parse returned 47 season rows; 1978, 1987, and 2021 are missing from this parse and some early rows have blank playoff fields — those years/fields are labeled PENDING verification, not filled in. Check the linked Wikipedia season list for those years.</small></p></div>`;
 // draft
 draft.innerHTML=`<div class="src">Source: nflverse draft_picks dataset (github.com/nflverse/nflverse-data, sourced from Pro-Football-Reference)<br>VERIFICATION: First-round picks cross-checked nflverse (PFR-sourced) vs Wikipedia first-round list: 39/44 matched on player+pick (36 exact + 3 name-format variants), 0 true disagreements, 5 unparsed due to table rowspan — those 5 + all rounds 2–7 are SINGLE-SOURCE (nflverse/PFR) pending cross-check. Coverage: <b>1980–2026 in this file — ${draft.length} Seahawks picks</b>. Seahawks' 1976–1979 drafts are NOT in this dataset file, so they are not claimed here and are coming in a later expansion.<br>Last updated: ${sea.meta.fetched_at_ct} CT</div>
 <div class="card"><label>Search player/college<input id="dq" placeholder="Search…"></label><label>Year<select id="dy"><option value="">All years</option></select></label><label>Round<select id="dr"><option value="">All rounds</option></select></label><label>Position<select id="dp"><option value="">All positions</option></select></label><div id="dcount"></div><table><thead><tr><th>Year</th><th>Rd</th><th>Pick</th><th>Player</th><th>Pos</th><th>College</th></tr></thead><tbody id="db"></tbody></table></div>`;
 let years=[...new Set(draft.map(x=>x.year))].sort((a,b)=>b-a), rounds=[...new Set(draft.map(x=>x.round))].sort((a,b)=>a-b), poss=[...new Set(draft.map(x=>x.pos).filter(Boolean))].sort();
 dy.innerHTML+=years.map(y=>`<option>${y}</option>`).join(''); dr.innerHTML+=rounds.map(r=>`<option>${r}</option>`).join(''); dp.innerHTML+=poss.map(x=>`<option>${x}</option>`).join('');
 function rd(){let q=dq.value.toLowerCase(), f=draft.filter(x=>(!dy.value||x.year==dy.value)&&(!dr.value||x.round==dr.value)&&(!dp.value||x.pos==dp.value)&&(!q||x.player.toLowerCase().includes(q)||(x.college||'').toLowerCase().includes(q)));dcount.innerHTML=`<b>${f.length} picks</b>`;db.innerHTML=f.map(x=>`<tr><td>${x.year}</td><td>${x.round}</td><td>${x.pick}</td><td><b>${x.player}</b></td><td>${x.pos}</td><td>${x.college}</td></tr>`).join('')}
 [dq,dy,dr,dp].forEach(e=>e.oninput=rd); rd();
 // records
 let cats=[...new Set(records.records.map(r=>r.section))];
 let rh=`<div class="src">VERIFICATION: Records list is SINGLE-SOURCE (Wikipedia, citing PFR) pending full cross-check, except spot-checked key records (Wilson 452 pass yds, Alexander 266 rush yds, Largent 261 rec yds) which matched independent reporting. PFR direct fetch was blocked (403) on this box. Source: ${records.source}<br>Last updated: ${sea.meta.fetched_at_ct} CT • Streak add-on computed below from nflverse games.</div>
 <div class="card"><h3>Streaks</h3><p><b>Longest regular-season win streak (computed):</b> ${streaks.win_streak.games} games — ${streaks.win_streak.start} to ${streaks.win_streak.end}.<br><small>${streaks.win_streak.scope}; games file covers 1999 onward, so earlier streaks are not computed here.</small></p><p>From the team-records list: Most consecutive pass completions, game: Sam Darnold, 17 (2025) and Warren Moon, 17 (1998) • Most consecutive field goals made: Jason Myers, 37 (2019–2021) • Most consecutive games started: Russell Wilson, 149 • Most consecutive home wins: Pete Carroll, 14 (2013–2014)</p><p><small>Consecutive-games-with-TD / sack / INT player streaks: not verified in the fetched sources for v1 — labeled unavailable rather than invented.</small></p></div>`;
 cats.forEach(c=>{rh+=`<div class="card"><h3>${c}</h3>`+records.records.filter(r=>r.section==c).map(r=>`<p>• ${r.text}</p>`).join('')+`</div>`});
 document.getElementById('records').innerHTML=rh;

 // matchups
 let mh=`<div class="src">VERIFICATION: Computed tables are SINGLE-SOURCE (nflverse games, computed) pending clean second count, except 2025 W-L 14-3 which matched Wikipedia season table. Source: ${exp.source}<br>Last updated: ${sea.meta.fetched_at_ct} CT<br>Opponent codes are as in the nflverse file (includes historical/relocated codes e.g. STL, SD, OAK in addition to current teams). Splits computed only from games in that file.</div><div class="card"><h3>Head-to-head — Seahawks vs each opponent (1999–2026 file)</h3><input id="mq" placeholder="Filter opponent code…"><table><thead><tr><th>Opp</th><th>All W-L-T</th><th>Regular</th><th>Playoffs</th><th>Home</th><th>Away</th><th>PF-PA (all)</th><th>Last meeting</th></tr></thead><tbody id="mb"></tbody></table></div>`;
 document.getElementById('matchups').innerHTML=mh;
 const fmt=x=>`${x.w}-${x.l}${x.t?'-'+x.t:''}`;
 function rm(){let q=document.getElementById('mq').value.toUpperCase();document.getElementById('mb').innerHTML=exp.h2h.filter(x=>x.opp.includes(q)).map(x=>`<tr><td><b>${x.opp}</b></td><td>${fmt(x.all)}</td><td>${fmt(x.reg)}</td><td>${fmt(x.post)}</td><td>${fmt(x.home)}</td><td>${fmt(x.away)}</td><td>${x.all.pf}-${x.all.pa}</td><td>${x.last}</td></tr>`).join('')}
 document.getElementById('mq').oninput=rm; rm();

 // college
 let ch=`<div class="src">Player profiles — Seahawks depth-chart players only in v1 (${college.coverage.depth_players} players).<br>College + draft: ESPN Core API, cross-checked vs nflverse draft_picks (PFR-sourced): ${college.coverage.draft_espn_nflverse_exact_match} players match exactly on draft year/round/pick in both sources (marked ✓ 2-source). Others are single-source.<br>College season stats: ${college.source_college_stats}<br>Coverage: ${college.coverage.with_college_name}/${college.coverage.depth_players} with college name, ${college.coverage.with_college_season_stats}/${college.coverage.depth_players} with at least one college season stat line. Offensive linemen / many defenders often have no ESPN college stat categories — blank means no stat line returned, not zero/invented.<br>Last updated: ${sea.meta.fetched_at_ct} CT</div>
 <div class="card"><input id="cq" placeholder="Search player / college…"><div id="clist"></div></div>`;
 document.getElementById('college').innerHTML=ch;
 function rc(){let q=document.getElementById('cq').value.toLowerCase();document.getElementById('clist').innerHTML=college.players.filter(x=>x.name.toLowerCase().includes(q)||(x.college_espn||'').toLowerCase().includes(q)).map(x=>{
   let verified=(x.draft_espn&&x.draft_nflverse&&x.draft_espn.year==x.draft_nflverse.year&&x.draft_espn.round==x.draft_nflverse.round&&x.draft_espn.pick==x.draft_nflverse.pick)?'✓ 2-source draft':'single-source draft';
   let seasons=x.college_seasons&&x.college_seasons.length?x.college_seasons.map(s=>`<p><b>${s.year}:</b> ${Object.entries(s.stats).slice(0,14).map(([k,v])=>`${k}: ${v}`).join(' • ')}</p>`).join(''):'<p><small>No college season stat line returned by ESPN (single-source check pending).</small></p>';
   return `<div style="border-bottom:1px solid #2a4a73;padding:12px 0"><b style="font-size:18px">${x.name}</b> ${x.depth_pos} — ${x.college_espn||'College unknown'}<br>Draft: ${x.draft_espn?`${x.draft_espn.year} Rd ${x.draft_espn.round} Pick ${x.draft_espn.pick}`:'Undrafted / not in ESPN draft field'} ${x.draft_nflverse?`(nflverse: ${x.draft_nflverse.year} Rd ${x.draft_nflverse.round} Pick ${x.draft_nflverse.pick}, ${x.draft_nflverse.team}, ${x.draft_nflverse.college})`:''} <span class="badge" style="background:#276749">${verified}</span>${seasons}</div>`}).join('')}
 document.getElementById('cq').oninput=rc; rc();

 // playoffs
 let ph=`<div class="src">Sources: Playoff games computed from nflverse games file (1999–2026 coverage, see Matchups note); playoff franchise records from ${prec.source}<br>Last updated: ${sea.meta.fetched_at_ct} CT<br>Super Bowl note from Wikipedia season table as fetched: 2025 season listed as Won Super Bowl LX vs Patriots 29–13; earlier Super Bowl history (XLVIII win, XL & XLIX appearances) is in the full History/season source — playoff game list below starts 1999 because the games file does.</div>`;
 ph+=`<div class="card"><h3>Playoff games (1999 season onward, ${exp.playoff_games.length} games)</h3><table><tr><th>Date</th><th>Season</th><th>Opp</th><th>H/A</th><th>Result</th><th>Score</th></tr>${exp.playoff_games.map(g=>`<tr><td>${g.date}</td><td>${g.season}</td><td>${g.opp}</td><td>${g.home?'Home':'Away'}</td><td><b>${g.result}</b></td><td>${g.pf}-${g.pa}</td></tr>`).join('')}</table></div>`;
 ph+=`<div class="card"><h3>Playoff franchise records (${prec.playoff_records.length})</h3>`+prec.playoff_records.map(r=>`<p>• [${r.section}] ${r.text}</p>`).join('')+`</div>`;
 document.getElementById('playoffs').innerHTML=ph;
 // statsdb massive sortable/filterable: combine records + season team stats + career leaders
 let sb=`<div class="src">Massive sortable database v1 — sources: team records list + computed season team stats (nflverse games, 1999–2026) + draft file (see Draft tab). Last updated: ${sea.meta.fetched_at_ct} CT. Pending (labeled, not fabricated): full player-by-player game logs, pre-1999 game-level stats, consecutive TD/sack/INT streaks.</div>
 <div class="card"><h3>Season-by-season team stats (computed, 1999–2026)</h3><table><thead><tr><th>Year</th><th>Reg</th><th>PF</th><th>PA</th><th>Playoffs</th><th>PF-P</th><th>PA-P</th><th>Home</th><th>Away</th></tr></thead><tbody>${exp.seasons.map(x=>`<tr><td>${x.year}</td><td>${x.reg}</td><td>${x.pf_reg}</td><td>${x.pa_reg}</td><td>${x.post}</td><td>${x.pf_post}</td><td>${x.pa_post}</td><td>${x.home}</td><td>${x.away}</td></tr>`).join('')}</tbody></table></div>
 <div class="card"><h3>All records database — filter by category / text</h3><label>Category<select id="sc"><option value="">All categories</option>${[...new Set(records.records.map(r=>r.section))].map(c=>`<option>${c}</option>`).join('')}</select></label><input id="sq" placeholder="Search records… e.g. sacks, career, game"><div id="scount"></div><div id="slist"></div></div>`;
 document.getElementById('statsdb').innerHTML=sb;
 function rs(){let c=document.getElementById('sc').value,q=document.getElementById('sq').value.toLowerCase();let f=records.records.filter(r=>(!c||r.section==c)&&(!q||r.text.toLowerCase().includes(q)));document.getElementById('scount').innerHTML=`<b>${f.length} records</b>`;document.getElementById('slist').innerHTML=f.map(r=>`<p>• [${r.section}] ${r.text}</p>`).join('')}
 document.getElementById('sc').oninput=rs; document.getElementById('sq').oninput=rs; rs();

}
</script></body></html>
